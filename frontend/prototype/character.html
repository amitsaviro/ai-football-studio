<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אב-טיפוס: יוסי קרוסלה מדבר</title>
<style>
  :root { --bg: #f4f1ea; --card: #ffffff; --text: #1f1f1f; --muted: #6b6b6b; --accent: #1d4ed8; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .stage { background: var(--card); border-radius: 16px; padding: 16px 24px 8px; width: min(420px, 100%);
           box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
  svg { width: 260px; height: auto; overflow: visible; }
  .bubble { min-height: 48px; margin: 8px 0 12px; font-size: 15px; line-height: 1.6; text-align: center; }
  .bubble .spoken { color: var(--text); } .bubble .rest { color: #b5b5b5; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px;
             border: 1px solid #d6d3cc; resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
  button { flex: 1; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; border: 0; cursor: pointer;
           background: var(--accent); color: #fff; }
  button.secondary { background: #e7e4dd; color: var(--text); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }

  /* idle: breathing + blinking */
  #body   { animation: breathe 3.2s ease-in-out infinite; transform-origin: 150px 330px; }
  @keyframes breathe { 50% { transform: translateY(3px) scaleY(0.99); } }
  .eyelid { transform: scaleY(0); transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
  /* talking: head bob + raised brows + arm gesture */
  #head { transition: transform 0.3s ease; transform-origin: 150px 200px; }
  .talking #head { animation: bob 0.9s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg) translateY(-2px); } }
  #brows { transition: transform 0.2s; } .talking #brows { transform: translateY(-4px); }
  #arm { transform-origin: 205px 262px; transition: transform 0.4s; }
  .talking #arm { animation: gesture 1.6s ease-in-out infinite; }
  @keyframes gesture { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
  .mouth { display: none; } .mouth.on { display: inline; }
</style>
</head>
<body>
<h1>יוסי "קרוסלה" ישראלי</h1>
<p class="sub">אב-טיפוס: דמות SVG עם שפתיים שזזות וקול בעברית</p>

<div class="stage" id="stage">
  <svg viewBox="40 40 220 330" role="img" aria-label="יוסי קרוסלה, דמות מצוירת בחולצת נבחרת">
    <g id="body">
      <!-- torso: national team shirt -->
      <path d="M78 330 Q80 262 118 250 L182 250 Q220 262 222 330 Z" fill="#1d4ed8"/>
      <path d="M130 250 L150 272 L170 250 Z" fill="#ffffff"/>
      <text x="150" y="312" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="system-ui">10</text>
      <!-- left arm (static) -->
      <path d="M92 272 Q70 300 84 330" stroke="#1d4ed8" stroke-width="22" fill="none" stroke-linecap="round"/>
      <!-- right arm (gestures while talking) -->
      <g id="arm">
        <path d="M208 272 Q232 296 226 318" stroke="#1d4ed8" stroke-width="22" fill="none" stroke-linecap="round"/>
        <circle cx="226" cy="322" r="12" fill="#cf946b"/>
      </g>
      <rect x="136" y="204" width="28" height="50" rx="8" fill="#c98c62"/>
      <g id="head">
        <ellipse cx="96" cy="160" rx="10" ry="14" fill="#cf946b"/>
        <ellipse cx="204" cy="160" rx="10" ry="14" fill="#cf946b"/>
        <!-- earring: small silver hoop -->
        <circle cx="206" cy="174" r="4.5" fill="none" stroke="#c9ccd1" stroke-width="2.4"/>
        <circle cx="94" cy="174" r="2.6" fill="#e6e8eb"/>
        <ellipse cx="150" cy="158" rx="56" ry="66" fill="#d9a077"/>
        <!-- hair: classic gelled spikes, dark roots with bleached tips -->
        <path d="M96 146 Q96 110 118 100 L150 96 L182 100 Q204 110 204 146 Q198 122 180 116 Q150 108 120 116 Q102 122 96 146 Z" fill="#2b1d14"/>
        <path d="M98 122 L92 92 L112 104 L110 70 L130 96 L136 60 L150 92 L162 58 L170 94 L190 66 L188 102 L208 90 L202 122 Q180 104 150 102 Q120 104 98 122 Z" fill="#2b1d14"/>
        <path d="M92 92 L100 99 L98 94 Z M110 70 L116 84 L112 83 Z M136 60 L140 76 L135 75 Z M162 58 L164 74 L159 73 Z M190 66 L188 80 L185 77 Z M208 90 L201 97 L203 92 Z" fill="#e9c46a"/>
        <path d="M110 70 L118 88 L113 86 Z M136 60 L142 80 L136 78 Z M162 58 L166 78 L160 77 Z M190 66 L189 84 L184 80 Z" fill="#e9c46a"/>
        <!-- stubble -->
        <path d="M104 178 Q110 222 150 226 Q190 222 196 178 Q186 206 150 210 Q114 206 104 178 Z" fill="#c9926c" opacity="0.55"/>
        <g id="brows">
          <path d="M116 128 Q128 120 140 127" stroke="#2b1d14" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M160 127 Q172 120 184 128" stroke="#2b1d14" stroke-width="6" fill="none" stroke-linecap="round"/>
        </g>
        <!-- eyes + eyelids (blink) -->
        <ellipse cx="128" cy="146" rx="9" ry="10" fill="#ffffff"/><circle cx="129" cy="147" r="5" fill="#3b2a1e"/>
        <ellipse cx="172" cy="146" rx="9" ry="10" fill="#ffffff"/><circle cx="171" cy="147" r="5" fill="#3b2a1e"/>
        <ellipse class="eyelid" cx="128" cy="146" rx="10" ry="11" fill="#d9a077"/>
        <ellipse class="eyelid" cx="172" cy="146" rx="10" ry="11" fill="#d9a077"/>
        <path d="M150 150 Q144 170 150 176 Q156 178 158 172" stroke="#c98c63" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- mouth shapes (visemes): only one is visible at a time -->
        <g id="mouths">
          <path class="mouth on" data-shape="closed" d="M130 194 Q150 204 170 194" stroke="#7a3b2e" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="mouth" data-shape="small" d="M134 192 Q150 200 166 192 Q150 208 134 192 Z" fill="#7a3b2e"/>
          <g class="mouth" data-shape="open">
            <path d="M130 190 Q150 196 170 190 Q166 218 150 220 Q134 218 130 190 Z" fill="#6b2d22"/>
            <path d="M136 208 Q150 202 164 208 Q158 218 150 218 Q142 218 136 208 Z" fill="#d9636b"/>
            <path d="M133 191 Q150 196 167 191 L166 195 Q150 199 134 195 Z" fill="#ffffff"/>
          </g>
          <ellipse class="mouth" data-shape="round" cx="150" cy="200" rx="10" ry="12" fill="#6b2d22"/>
        </g>
      </g>
    </g>
  </svg>

  <div class="bubble" id="bubble"><span class="rest">לחץ על "דבר" כדי לשמוע את יוסי</span></div>
  <textarea id="line">תקשיבו לי, השחקן הזה נלחם על כל כדור כאילו זה המשחק האחרון שלו! זה לא המספרים, זה הרעב. אני אומר לכם, זה שחקן!</textarea>
  <div class="row">
    <button id="speak">דבר ▶</button>
    <button id="stop" class="secondary">עצור</button>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
  const stage = document.getElementById("stage");
  const mouths = [...document.querySelectorAll(".mouth")];
  const bubble = document.getElementById("bubble");
  const note = document.getElementById("note");
  let talkTimer = null, voice = null;

  function setMouth(shape) {
    mouths.forEach(m => m.classList.toggle("on", m.dataset.shape === shape));
  }

  // Lip-sync by word boundaries: the browser tells us when each word starts; inside a word we
  // cycle through mouth shapes, then close the mouth briefly between words.
  function mouthWord(word) {
    clearInterval(talkTimer);
    const frames = Math.max(2, Math.round(word.length * 1.4));
    let i = 0;
    const cycle = ["small", "open", "round", "open", "small"];
    talkTimer = setInterval(() => {
      if (i >= frames) { clearInterval(talkTimer); setMouth("small"); return; }
      setMouth(cycle[(i + Math.floor(Math.random() * 2)) % cycle.length]);
      i++;
    }, 85);
  }

  // Fallback lip-sync: keep the mouth moving with short random pauses until speech ends.
  function talkGeneric() {
    clearInterval(talkTimer);
    const cycle = ["small", "open", "round", "open", "small", "closed"];
    talkTimer = setInterval(() => {
      if (!speechSynthesis.speaking) { clearInterval(talkTimer); setMouth("closed"); return; }
      setMouth(Math.random() < 0.12 ? "closed" : cycle[Math.floor(Math.random() * cycle.length)]);
    }, 95);
  }

  function showProgress(text, upTo) {
    bubble.innerHTML = "";
    const spoken = document.createElement("span"); spoken.className = "spoken"; spoken.textContent = text.slice(0, upTo);
    const rest = document.createElement("span"); rest.className = "rest"; rest.textContent = text.slice(upTo);
    bubble.append(spoken, rest);
  }

  function pickVoice() {
    const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("he"));
    voice = voices[0] || null;
    note.textContent = voice
      ? `קול: ${voice.name} (קול מובנה של הדפדפן — בהמשך נחליף לקולות איכותיים יותר)`
      : "לא נמצא קול עברי בדפדפן הזה. נסה ב-Safari או Chrome במק.";
  }
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();

  function stop() {
    speechSynthesis.cancel(); clearInterval(talkTimer);
    stage.classList.remove("talking"); setMouth("closed");
  }

  document.getElementById("speak").onclick = () => {
    stop();
    const text = document.getElementById("line").value.trim();
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "he-IL"; if (voice) u.voice = voice;
    u.rate = 1.05; u.pitch = 0.85;   // a bit lower and faster: an excited ex-player
    let gotBoundary = false;
    u.onstart = () => {
      stage.classList.add("talking"); showProgress(text, 0);
      // Some browsers never fire word-boundary events: fall back to generic talking.
      setTimeout(() => { if (!gotBoundary && speechSynthesis.speaking) talkGeneric(); }, 500);
    };
    u.onboundary = e => {
      if (e.name && e.name !== "word") return;
      gotBoundary = true;
      const word = text.slice(e.charIndex).split(/\s+/)[0] || "";
      mouthWord(word);
      showProgress(text, e.charIndex + word.length);
    };
    u.onend = () => { stop(); showProgress(text, text.length); };
    speechSynthesis.speak(u);
  };
  document.getElementById("stop").onclick = stop;
</script>
</body>
</html>
